<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(148, 163, 184, 0.05)" stroke-width="1"/>
    </pattern>
    
    <!-- Circuit Line Pattern -->
    <pattern id="circuit-lines" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Horizontal lines -->
      <line x1="0" y1="50" x2="200" y2="50" stroke="rgba(34, 211, 238, 0.2)" stroke-width="2"/>
      <line x1="0" y1="150" x2="200" y2="150" stroke="rgba(79, 209, 197, 0.2)" stroke-width="2"/>
      
      <!-- Vertical lines -->
      <line x1="50" y1="0" x2="50" y2="200" stroke="rgba(34, 211, 238, 0.2)" stroke-width="2"/>
      <line x1="150" y1="0" x2="150" y2="200" stroke="rgba(79, 209, 197, 0.2)" stroke-width="2"/>
      
      <!-- Connection nodes -->
      <circle cx="50" cy="50" r="4" fill="rgba(34, 211, 238, 0.5)"/>
      <circle cx="150" cy="50" r="4" fill="rgba(79, 209, 197, 0.5)"/>
      <circle cx="50" cy="150" r="4" fill="rgba(79, 209, 197, 0.5)"/>
      <circle cx="150" cy="150" r="4" fill="rgba(34, 211, 238, 0.5)"/>
      
      <!-- IC pads -->
      <rect x="45" y="45" width="10" height="10" fill="none" stroke="rgba(34, 211, 238, 0.3)" stroke-width="1"/>
      <rect x="145" y="145" width="10" height="10" fill="none" stroke="rgba(79, 209, 197, 0.3)" stroke-width="1"/>
    </pattern>
    
    <!-- Radial gradient for vignette -->
    <radialGradient id="vignette">
      <stop offset="0%" style="stop-color:rgb(11,14,20);stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:rgb(11,14,20);stop-opacity:0.9" />
    </radialGradient>
    
    <!-- Noise filter -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend mode="multiply" in="SourceGraphic"/>
    </filter>
  </defs>
  
  <!-- Base dark background -->
  <rect width="1920" height="1080" fill="#0B0E14"/>
  
  <!-- Grid layer -->
  <rect width="1920" height="1080" fill="url(#grid)"/>
  
  <!-- Circuit pattern layer -->
  <rect width="1920" height="1080" fill="url(#circuit-lines)" opacity="0.6"/>
  
  <!-- Large IC components -->
  <g opacity="0.4">
    <!-- Top-left IC -->
    <rect x="100" y="80" width="200" height="120" fill="none" stroke="rgba(34, 211, 238, 0.4)" stroke-width="2" rx="4"/>
    <line x1="100" y1="100" x2="80" y2="100" stroke="rgba(34, 211, 238, 0.4)" stroke-width="2"/>
    <line x1="100" y1="130" x2="80" y2="130" stroke="rgba(34, 211, 238, 0.4)" stroke-width="2"/>
    <line x1="100" y1="160" x2="80" y2="160" stroke="rgba(34, 211, 238, 0.4)" stroke-width="2"/>
    <line x1="300" y1="100" x2="320" y2="100" stroke="rgba(34, 211, 238, 0.4)" stroke-width="2"/>
    <line x1="300" y1="130" x2="320" y2="130" stroke="rgba(34, 211, 238, 0.4)" stroke-width="2"/>
    <line x1="300" y1="160" x2="320" y2="160" stroke="rgba(34, 211, 238, 0.4)" stroke-width="2"/>
    <text x="200" y="145" text-anchor="middle" fill="rgba(34, 211, 238, 0.6)" font-family="JetBrains Mono, monospace" font-size="14">ASYNC</text>
    
    <!-- Top-right IC -->
    <rect x="1420" y="80" width="180" height="100" fill="none" stroke="rgba(79, 209, 197, 0.4)" stroke-width="2" rx="4"/>
    <line x1="1420" y1="100" x2="1400" y2="100" stroke="rgba(79, 209, 197, 0.4)" stroke-width="2"/>
    <line x1="1420" y1="130" x2="1400" y2="130" stroke="rgba(79, 209, 197, 0.4)" stroke-width="2"/>
    <line x1="1420" y1="160" x2="1400" y2="160" stroke="rgba(79, 209, 197, 0.4)" stroke-width="2"/>
    <line x1="1600" y1="100" x2="1620" y2="100" stroke="rgba(79, 209, 197, 0.4)" stroke-width="2"/>
    <line x1="1600" y1="130" x2="1620" y2="130" stroke="rgba(79, 209, 197, 0.4)" stroke-width="2"/>
    <line x1="1600" y1="160" x2="1620" y2="160" stroke="rgba(79, 209, 197, 0.4)" stroke-width="2"/>
    <text x="1510" y="135" text-anchor="middle" fill="rgba(79, 209, 197, 0.6)" font-family="JetBrains Mono, monospace" font-size="14">CORE</text>
    
    <!-- Bottom-left IC -->
    <rect x="150" y="780" width="160" height="140" fill="none" stroke="rgba(249, 115, 22, 0.4)" stroke-width="2" rx="4"/>
    <circle cx="230" cy="850" r="30" fill="none" stroke="rgba(249, 115, 22, 0.4)" stroke-width="2"/>
    <text x="230" y="855" text-anchor="middle" fill="rgba(249, 115, 22, 0.6)" font-family="JetBrains Mono, monospace" font-size="12">CLK</text>
    
    <!-- Bottom-right IC -->
    <rect x="1520" y="800" width="220" height="160" fill="none" stroke="rgba(34, 211, 238, 0.4)" stroke-width="2" rx="4"/>
    <line x1="1560" y1="800" x2="1560" y2="780" stroke="rgba(34, 211, 238, 0.4)" stroke-width="2"/>
    <line x1="1600" y1="800" x2="1600" y2="780" stroke="rgba(34, 211, 238, 0.4)" stroke-width="2"/>
    <line x1="1640" y1="800" x2="1640" y2="780" stroke="rgba(34, 211, 238, 0.4)" stroke-width="2"/>
    <line x1="1680" y1="800" x2="1680" y2="780" stroke="rgba(34, 211, 238, 0.4)" stroke-width="2"/>
    <text x="1630" y="885" text-anchor="middle" fill="rgba(34, 211, 238, 0.6)" font-family="JetBrains Mono, monospace" font-size="14">TECH</text>
  </g>
  
  <!-- Connecting traces -->
  <g opacity="0.5">
    <!-- Curved traces -->
    <path d="M 300 140 Q 600 140, 900 300" fill="none" stroke="rgba(34, 211, 238, 0.3)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 1420 130 Q 1200 130, 1000 400" fill="none" stroke="rgba(79, 209, 197, 0.3)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 310 850 Q 700 850, 1100 700" fill="none" stroke="rgba(249, 115, 22, 0.3)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Straight traces with pads -->
    <line x1="900" y1="300" x2="900" y2="500" stroke="rgba(34, 211, 238, 0.3)" stroke-width="2"/>
    <circle cx="900" cy="500" r="5" fill="rgba(34, 211, 238, 0.5)"/>
    
    <line x1="1000" y1="400" x2="1200" y2="600" stroke="rgba(79, 209, 197, 0.3)" stroke-width="2"/>
    <circle cx="1200" cy="600" r="5" fill="rgba(79, 209, 197, 0.5)"/>
  </g>
  
  <!-- Capacitors -->
  <g opacity="0.4">
    <rect x="880" y="490" width="40" height="20" fill="none" stroke="rgba(34, 211, 238, 0.4)" stroke-width="2" rx="2"/>
    <line x1="890" y1="500" x2="910" y2="500" stroke="rgba(34, 211, 238, 0.4)" stroke-width="2"/>
    
    <rect x="1180" y="590" width="40" height="20" fill="none" stroke="rgba(79, 209, 197, 0.4)" stroke-width="2" rx="2"/>
    <line x1="1190" y1="600" x2="1210" y2="600" stroke="rgba(79, 209, 197, 0.4)" stroke-width="2"/>
  </g>
  
  <!-- Via holes -->
  <g opacity="0.3">
    <circle cx="400" cy="200" r="3" fill="rgba(148, 163, 184, 0.5)"/>
    <circle cx="700" cy="350" r="3" fill="rgba(148, 163, 184, 0.5)"/>
    <circle cx="1300" cy="250" r="3" fill="rgba(148, 163, 184, 0.5)"/>
    <circle cx="500" cy="700" r="3" fill="rgba(148, 163, 184, 0.5)"/>
    <circle cx="1100" cy="600" r="3" fill="rgba(148, 163, 184, 0.5)"/>
  </g>
  
  <!-- Center focal area - lighter for content visibility -->
  <ellipse cx="960" cy="540" rx="800" ry="500" fill="rgba(11, 14, 20, 0.7)"/>
  
  <!-- Vignette overlay -->
  <rect width="1920" height="1080" fill="url(#vignette)" opacity="0.7"/>
  
  <!-- Subtle noise texture -->
  <rect width="1920" height="1080" fill="rgba(148, 163, 184, 0.02)" filter="url(#noise)"/>
</svg>
